# Include in an already approved Nginx http{} context. This template is not
# evidence that Nginx is installed or approved on the actual host.
server {
    listen 127.0.0.1:18474;
    server_name _;
    access_log off;
    error_log /dev/stderr crit;
    client_max_body_size 4k;
    client_body_timeout 10s;
    location ~ ^/api/v1/newsletter/(subscribe|confirm|unsubscribe)$ {
        # Nginx denies all methods except POST before proxying.
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:18473;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-MyChef-Newsletter-Source $http_x_mychef_newsletter_source;
        proxy_set_header Cookie "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 20s;
        proxy_send_timeout 10s;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex" always;
    }
    location / { return 404; }
}
