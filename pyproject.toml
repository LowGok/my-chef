[project]
name = "mychef-tooling"
version = "0.0.0"
description = "Build, audit and release helpers for the Go/TypeScript MyChef application"
requires-python = ">=3.15.2,<3.16"
dependencies = [
    "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "pip-audit==2.10.1",
    "pytest==9.2.0",
]

[tool.uv]
package = false
required-version = "==0.13.7"
