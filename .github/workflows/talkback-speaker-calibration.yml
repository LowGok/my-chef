name: Android speaker calibration
on:
  push:
    branches: [ci/reminder-talkback-preflight-0f3e4a8]
    paths:
      - .github/workflows/talkback-speaker-calibration.yml
      - scripts/verification/talkback/calibration/**
permissions:
  contents: read
jobs:
  calibration:
    if: github.repository_id == '1454481532' && github.repository == 'LowGok/my-chef' && !github.event.repository.private && github.actor == 'LowGok'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Prepare stock Android and local audio tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg pulseaudio pulseaudio-utils xvfb
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install             platform-tools emulator 'platforms;android-33' 'build-tools;36.0.0' 'system-images;android-33;google_apis;x86_64'
          sudo chmod a+rw /dev/kvm
      - name: Compare host tone, Android media, accessibility stream and stock TTS
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          python3 scripts/verification/talkback/calibration/run.py "$RUNNER_TEMP/speaker-calibration.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-speaker-calibration
          path: ${{ runner.temp }}/speaker-calibration.json
          if-no-files-found: error
          retention-days: 1
