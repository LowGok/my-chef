name: Native verification

on:
  push:
    branches: [ci/analytics-installed-b9e9699]
    paths:
      - .github/workflows/native-compile.yml
      - mobile/tests/**
      - mobile/ios/App/App/MyChefNativePlugin.swift
      - scripts/test_native_installed.py
      - scripts/native-android-journeys.ts
      - scripts/native-android/**
      - scripts/native_android_probe.py
      - scripts/native-android-report.ts
      - scripts/native-android-report.test.ts
      - scripts/mobile-java.test.ts
      - scripts/test_native_verification.py
      - scripts/test_analytics_ci.py
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: native-verify-${{ github.event_name == 'push' && github.sha || github.event.pull_request.number }}-${{ github.event.label.name }}
  cancel-in-progress: false

jobs:
  analytics-journeys:
    if: >-
      github.event_name == 'push' &&
      github.repository == 'LowGok/my-chef' && github.repository_id == '1454481532' &&
      github.event.repository.private == false && github.actor == 'LowGok' &&
      github.event.repository.full_name == github.repository && github.event.sender.login == 'LowGok' &&
      github.event.deleted == false && github.event.after == github.sha &&
      github.ref == 'refs/heads/ci/analytics-installed-b9e9699'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        platform: [android, ios-simulator]
    runs-on: ${{ matrix.platform == 'android' && 'ubuntu-24.04' || 'macos-15' }}
    timeout-minutes: 35
    env:
      CI: "1"
      CAPACITOR_TELEMETRY_DISABLED: "1"
      NATIVE_PLATFORM: ${{ matrix.platform }}
      NATIVE_ANALYTICS_JOURNEYS: "1"
      NATIVE_ANALYTICS_SPEECH: ${{ matrix.platform == 'android' && '1' || '0' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: mobile/package.json
          no-cache: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      # Public Maven/Gradle dependencies only: no application, key or fixture output.
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: matrix.platform == 'android'
        id: analytics-gradle
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: analytics-gradle-${{ runner.os }}-${{ hashFiles('mobile/android/**/gradle.lockfile', 'mobile/android/gradle/verification-metadata.xml', 'mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Compile isolated unsigned analytics candidate
        run: bun mobile/tests/analytics-compile.ts
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: matrix.platform == 'android' && steps.analytics-gradle.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: ${{ steps.analytics-gradle.outputs.cache-primary-key }}
      - name: Verify the approved simulator transfer boundary
        if: matrix.platform == 'ios-simulator'
        run: python3 mobile/tests/analytics_artifact.py
      - name: Retain the same unsigned simulator input for VoiceOver
        if: matrix.platform == 'ios-simulator'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: analytics-voiceover-input-${{ github.sha }}
          path: |
            mobile/.generated/artifacts/analytics-compilation.json
            mobile/.generated/artifacts/analytics-simulator.app.zip
            mobile/.generated/simulator-keychain.plist
          if-no-files-found: error
          retention-days: 1
          overwrite: true
      - name: Prepare pinned local TalkBack recognition tools
        if: matrix.platform == 'android'
        run: python3 mobile/tests/analytics_speech.py prepare
      - name: Verify installed authenticated analytics journeys
        run: python3 mobile/tests/analytics_installed.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: analytics-journeys-${{ matrix.platform }}-${{ github.sha }}
          path: |
            mobile/.generated/artifacts/analytics-installed-observations.json
            mobile/.generated/artifacts/analytics-anonymous.png
            mobile/.generated/artifacts/analytics-anonymous.json
          if-no-files-found: ignore
          retention-days: 1
          overwrite: true
  analytics-voiceover:
    needs: analytics-journeys
    if: >-
      always() && !cancelled() && github.event_name == 'push' &&
      github.repository == 'LowGok/my-chef' && github.repository_id == '1454481532' &&
      github.event.repository.private == false && github.actor == 'LowGok' &&
      github.event.repository.full_name == github.repository && github.event.sender.login == 'LowGok' &&
      github.event.deleted == false && github.event.after == github.sha &&
      github.ref == 'refs/heads/ci/analytics-installed-b9e9699'
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      CI: "1"
      CAPACITOR_TELEMETRY_DISABLED: "1"
      NATIVE_PLATFORM: ios-simulator
      NATIVE_ANALYTICS_VOICEOVER: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: mobile/package.json
          no-cache: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: analytics-voiceover-input-${{ github.sha }}
          path: mobile/.generated/voiceover-input
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        continue-on-error: true
        with:
          name: analytics-journeys-ios-simulator-${{ github.sha }}
          path: mobile/.generated/voiceover-primary
      - name: Build backend assets from the same source
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Verify real VoiceOver output on the same unsigned app
        run: python3 mobile/tests/analytics_voiceover.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: analytics-voiceover-${{ github.sha }}
          path: mobile/.generated/artifacts/analytics-installed-voiceover.json
          if-no-files-found: error
          retention-days: 1
          overwrite: true
  compile:
    if: >-
      github.repository == 'LowGok/my-chef' &&
      github.repository_id == '1454481532' &&
      github.event.repository.private == false &&
      vars.NATIVE_VERIFICATION_PR != '' &&
      github.event.pull_request.number == fromJSON(vars.NATIVE_VERIFICATION_PR) &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.id == github.event.repository.id &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/native-mobile' &&
      github.event.sender.login == 'LowGok' &&
      contains(fromJSON('["native-compile","native-installed","native-installed-android","native-installed-ios-simulator"]'), github.event.label.name)
    strategy:
      fail-fast: false
      max-parallel: ${{ github.event.label.name == 'native-installed' && 2 || 1 }}
      matrix:
        platform: ${{ fromJSON(github.event.label.name == 'native-installed' && '["android","ios-simulator"]' || github.event.label.name == 'native-installed-android' && '["android"]' || github.event.label.name == 'native-installed-ios-simulator' && '["ios-simulator"]' || '["android","ios-simulator","ios-device"]') }}
    runs-on: ${{ matrix.platform == 'android' && 'ubuntu-24.04' || matrix.platform == 'ios-simulator' && 'macos-15' || 'macos-26' }}
    timeout-minutes: 25
    env:
      CI: "1"
      NATIVE_VERIFICATION_PR: ${{ vars.NATIVE_VERIFICATION_PR }}
      NATIVE_PLATFORM: ${{ matrix.platform }}
      NATIVE_ANDROID_JOURNEYS: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: mobile/package.json
          no-cache: true
      - name: Compile without tests or distribution
        run: bun scripts/mobile-compile.ts
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: startsWith(github.event.label.name, 'native-installed')
        with:
          go-version-file: go.mod
          cache: false
      - name: Prepare locked Android fixture tools
        if: matrix.platform == 'android' && startsWith(github.event.label.name, 'native-installed')
        run: python3 scripts/rewrite.py bootstrap
      - name: Verify installed native session and relaunch
        if: startsWith(github.event.label.name, 'native-installed')
        run: python3 scripts/test_native_installed.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-compile-${{ matrix.platform }}-${{ github.event.pull_request.head.sha }}
          path: |
            mobile/.generated/artifacts/compilation.json
            mobile/.generated/artifacts/installed-smoke.json
            mobile/.generated/artifacts/installed-journeys.json
          if-no-files-found: warn
          retention-days: 1
          include-hidden-files: false
