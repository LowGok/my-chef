            "$ref": "#/components/schemas/ImportedDraft"
          },
          "complete": {
            "type": "boolean"
          }
        },
        "required": [
          "id",
          "draft",
          "complete"
        ]
      },
      "RecipeImport": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^[0-9a-f]{32}$"
          },
          "kind": {
            "type": "string",
            "enum": [
              "url",
              "photos"
            ]
          },
          "stage": {
            "type": "string",
            "enum": [
              "checking",
              "selection",
              "awaiting-ai",
              "reading",
              "ready",
              "saved",
              "failed",
              "cancelled",
              "expired"
            ]
          },
          "code": {
            "type": "string",
            "maxLength": 40
          },
          "expiresAt": {
            "type": "string",
            "format": "date-time"
          },
          "canReadWithAI": {
            "type": "boolean"
          },
          "candidates": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/ImportCandidate"
            },
            "maxItems": 12
          },
          "draft": {
            "$ref": "#/components/schemas/ImportedDraft"
          },
          "recipeId": {
            "type": "string",
            "pattern": "^[0-9a-f]{32}$"
          },
          "versionId": {
            "type": "string",
            "pattern": "^[0-9a-f]{32}$"
          }
        },
        "required": [
          "id",
          "kind",
          "stage",
          "expiresAt",
          "canReadWithAI",
          "candidates"
        ]
      },
      "ImportAvailability": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "available": {
            "type": "boolean"
          },
          "aiAvailable": {
            "type": "boolean"
