        "name": "mychef_session"
      }
    },
    "schemas": {
      "PersonalImportSaveInput": {
        "type": "object",
        "additionalProperties": false,
        "description": "Only for a new imported recipe. Confirmation binds the exact reviewed draft and normalized editor content. It cannot accompany an update or sourceRecipeId. No client-supplied source URL, vault or provider settings are accepted.",
        "properties": {
          "operationId": {
            "type": "string",
            "pattern": "^[0-9a-f]{32}$"
          },
          "confirmation": {
            "$ref": "#/components/schemas/ImportConfirmation"
          }
        },
        "required": [
          "operationId",
          "confirmation"
        ]
      },
      "ImportSource": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "kind": {
            "type": "string",
            "enum": [
              "url",
              "photos"
            ]
          },
          "url": {
            "type": "string",
            "maxLength": 4096
          },
          "title": {
            "type": "string",
            "maxLength": 200
          },
          "importedAt": {
            "type": "string",
            "format": "date-time"
          }
        },
        "required": [
          "kind",
          "importedAt"
        ]
      },
      "ImportIssue": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "field": {
            "type": "string",
            "maxLength": 120
          },
          "reason": {
            "type": "string",
            "enum": [
              "missing",
              "ambiguous",
              "invalid",
              "unverified"
            ]
          },
          "sourceText": {
            "type": "string",
            "maxLength": 4000
          }
        },
        "required": [
          "field",
          "reason"
        ]
      },
      "ImportedRecipeValues": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "schemaVersion": {
            "type": "integer",
            "const": 1
          },
          "title": {
            "type": "string"
          },
          "description": {
            "type": "string"
          },
          "servings": {
            "type": "integer"
          },
          "equipment": {
            "type": "string"
          },
          "prepMinutes": {
            "type": "integer"
          },
          "cookMinutes": {
            "type": "integer"
          },
          "totalMinutes": {
            "type": "integer"
          },
          "ingredients": {
            "type": "array",
            "items": {
              "type": "object",
              "additionalProperties": false,
              "properties": {
                "name": {
                  "type": "string"
                },
                "quantity": {
                  "anyOf": [
                    {
                      "type": "string"
                    },
                    {
                      "type": "null"
                    }
                  ]
                },
                "unit": {
                  "anyOf": [
                    {
                      "type": "string"
                    },
                    {
                      "type": "null"
                    }
                  ]
                }
              },
              "required": [
                "name",
                "quantity",
                "unit"
              ]
            }
          },
          "instructions": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "tips": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "allergens": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "allergenNote": {
            "type": "string"
          }
        },
        "required": [
          "schemaVersion",
          "title",
          "description",
          "servings",
          "equipment",
          "prepMinutes",
          "cookMinutes",
          "totalMinutes",
          "ingredients",
          "instructions",
          "tips",
          "allergens",
          "allergenNote"
        ],
        "description": "Unsaved imported values with explicit issues. Corrections and ordinary PersonalRecipeContent validation are required before Save."
      },
      "ImportedDraft": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "content": {
            "$ref": "#/components/schemas/ImportedRecipeValues"
          },
          "source": {
            "$ref": "#/components/schemas/ImportSource"
          },
          "sourceYield": {
            "type": "array",
            "items": {
              "type": "string",
              "maxLength": 4000
            },
            "maxItems": 30
          },
          "issues": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/ImportIssue"
            },
            "maxItems": 500
          },
          "revision": {
            "type": "string",
            "pattern": "^[0-9a-f]{64}$"
          }
        },
        "required": [
          "content",
          "source",
          "sourceYield",
          "issues",
          "revision"
        ]
      },
      "ImportCandidate": {
        "type": "object",
