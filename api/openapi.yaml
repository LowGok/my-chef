{
  "openapi": "3.1.0",
  "info": {
    "title": "MyChef API",
    "version": "0.1.0",
    "description": "Meal/account IDs and quantities are decimal strings. Personal recipe/version/entry/photo IDs are opaque 32-character lowercase hex handles; unscheduled personal snapshot and ingredient IDs use a personal: prefix. Dates are calendar dates; history uses an exclusive to date. Cookie-authenticated writes require the configured exact Origin and X-CSRF-Token. Generation is asynchronous and never automatically retries a paid provider call. Authenticated responses identify the acting session in X-MyChef-User; clients discard responses from a superseded session."
  },
  "paths": {
    "/api/v1/account/export": {
      "post": {
        "operationId": "exportAccount",
        "description": "Available to verified and unverified signed-in accounts in either tier. Re-enter the current password to stream a consistent private ZIP; no archive is stored or emailed.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/AccountExportRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Format-2 ZIP with JSON files, readable contents guide, every retained personal recipe version and normalized referenced photos under export-local names. No original photos or provider handles. Any unavailable or changed photo fails the export. Interrupted transfers are incomplete and must be discarded.",
            "headers": {
              "Content-Disposition": {
                "schema": {
                  "type": "string"
                }
              },
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "const": "private, no-store"
                }
              },
              "X-MyChef-User": {
                "schema": {
                  "type": "string"
                }
              },
              "X-Content-Type-Options": {
                "schema": {
                  "type": "string",
                  "const": "nosniff"
                }
              }
            },
            "content": {
              "application/zip": {
                "schema": {
                  "type": "string",
                  "format": "binary"
                }
              }
            }
          },
          "400": {
            "description": "Incorrect current password, malformed input or confirmation.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "401": {
            "description": "An active signed-in account is required.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "Missing or invalid Origin or CSRF token.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "429": {
            "description": "Too many password attempts.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "headers": {
              "Retry-After": {
                "schema": {
                  "type": "integer",
                  "minimum": 1
                }
              }
            }
          },
          "503": {
            "description": "Account storage or its independent lifecycle journal is unavailable.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/account/deletion": {
      "post": {
        "operationId": "deleteAccount",
        "description": "Immediately and permanently remove the live account after current-password verification and exact DELETE confirmation. Revokes all sessions. The opaque operation key prevents duplicate side effects; a revoked session cannot authenticate a replay. Third-party image cleanup remains durable until resolved.",
        "parameters": [
          {
            "in": "header",
            "name": "Idempotency-Key",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[0-9a-f]{32}$"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/AccountDeletionRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Live account deletion committed and independent restore-prevention marker durable.",
            "headers": {
              "Set-Cookie": {
                "schema": {
                  "type": "string"
                }
              },
              "X-MyChef-User": {
                "schema": {
                  "type": "string"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AccountDeletionResult"
                }
              }
            }
          },
          "409": {
            "description": "Conflicting operation key.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "400": {
            "description": "Incorrect current password, malformed input or confirmation.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "401": {
            "description": "An active signed-in account is required.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "Missing or invalid Origin or CSRF token.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "429": {
            "description": "Too many password attempts.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "headers": {
              "Retry-After": {
                "schema": {
                  "type": "integer",
                  "minimum": 1
                }
              }
            }
          },
          "503": {
            "description": "Account storage or its independent lifecycle journal is unavailable.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
