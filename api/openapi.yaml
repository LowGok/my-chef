          "photosAvailable": {
            "type": "boolean"
          },
          "fixture": {
            "type": "boolean"
          }
        },
        "required": [
          "available",
          "aiAvailable",
          "fixture"
        ]
      },
      "UrlImportInput": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "requestKey": {
            "type": "string",
            "pattern": "^[0-9a-f]{32}$"
          },
          "url": {
            "type": "string",
            "maxLength": 4096
          },
          "personalUseConfirmed": {
            "type": "boolean",
            "const": true
          }
        },
        "required": [
          "requestKey",
          "url",
          "personalUseConfirmed"
        ]
      },
      "PhotoImportMetadata": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "requestKey": {
            "type": "string",
            "pattern": "^[0-9a-f]{32}$"
          },
          "personalUseConfirmed": {
            "type": "boolean",
            "const": true
          },
          "aiConsentConfirmed": {
            "type": "boolean",
            "const": true
          }
        },
        "required": [
          "requestKey",
          "personalUseConfirmed",
          "aiConsentConfirmed"
        ]
      },
      "ImportSelectionInput": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "candidateId": {
            "type": "string",
            "pattern": "^[0-9a-f]{64}$"
          }
        },
        "required": [
          "candidateId"
        ]
      },
      "ImportAiInput": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "aiConsentConfirmed": {
            "type": "boolean",
            "const": true
          }
        },
        "required": [
          "aiConsentConfirmed"
        ]
      },
      "ImportReviewInput": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "content": {
            "$ref": "#/components/schemas/PersonalRecipeContent"
          }
        },
        "required": [
          "content"
        ]
      },
      "ImportReview": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "content": {
            "$ref": "#/components/schemas/PersonalRecipeContent"
          },
          "contentRevision": {
            "type": "string",
            "pattern": "^[0-9a-f]{64}$"
          },
          "requiredFields": {
            "type": "array",
            "items": {
              "type": "string",
              "maxLength": 120
            },
            "maxItems": 250
          }
        },
        "required": [
