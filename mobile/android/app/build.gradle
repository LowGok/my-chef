import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

// The application ID varies; the compile namespace and activity classes do not.
def runtimeConfig = new File(rootProject.projectDir.parentFile, '.generated/runtime-config.json')
if (!runtimeConfig.isFile()) throw new GradleException('Prepare the reviewed native identity first')
def runtimeIdentity = new JsonSlurper().parse(runtimeConfig)
def identityLane = providers.gradleProperty('mychefIdentityLane').orElse('preview').get()
def identities = [
    preview: [appId: 'com.gkldevelopment.mychef.preview', appName: 'MyChef Preview'],
    app: [appId: 'dev.mychef.app', appName: 'MyChef']
]
def identity = identities[identityLane]
if (!identity || runtimeIdentity.appId != identity.appId ||
        runtimeIdentity.plugins?.MyChefNative?.identityLane != identityLane) {
    throw new GradleException('Native runtime and Android package identity differ')
}

def pushPreview = providers.gradleProperty('mychefPushPreview').map { it == 'true' }.orElse(false).get()
if (pushPreview) {
    def fileName = providers.gradleProperty('mychefFirebaseResources').orNull
    if (!fileName) throw new GradleException('Private Firebase Android resources are required')
    def resources = file(fileName)
    if (!resources.isDirectory() || !new File(resources, 'values/mychef-firebase.xml').isFile()) {
        throw new GradleException('Private Firebase Android resources are unavailable')
    }
    android.sourceSets.main.res.srcDir(resources)
    android.sourceSets.main.java.srcDir('src/push/java')
    android.sourceSets.debug.manifest.srcFile('src/push/AndroidManifest.xml')
    dependencyLocking.lockFile = file("$rootDir/dependency-locks/_app-push-preview.lockfile")
    androidComponents.beforeVariants(androidComponents.selector().withBuildType('release')) { variant ->
        variant.enable = false
    }
} else {
    android.sourceSets.main.java.srcDir('src/noPush/java')
}

android {
    namespace = "com.gkldevelopment.mychef.preview"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId identity.appId
        resValue 'string', 'app_name', identity.appName
        resValue 'string', 'title_activity_main', identity.appName
        resValue 'string', 'package_name', identity.appId
        resValue 'string', 'custom_url_scheme', identity.appId
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        def requestedCode = providers.gradleProperty('mychefVersionCode').orElse('1').get()
        def requestedName = providers.gradleProperty('mychefVersionName').orElse('0.1.0').get()
        if (!(requestedCode ==~ /[1-9][0-9]{0,9}/) || requestedCode.toLong() > 2147483647 || !(requestedName ==~ /[0-9]+\.[0-9]+\.[0-9]+/)) {
            throw new GradleException('Explicit valid native version/build required')
        }
        versionCode requestedCode.toInteger()
        versionName requestedName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    if (pushPreview) implementation 'com.google.firebase:firebase-messaging:25.1.3'

    // Independent cookie jar: Capacitor installs a global Java CookieHandler.
    implementation 'com.squareup.okhttp3:okhttp:5.5.1'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
